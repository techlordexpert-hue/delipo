<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mr.Music.Man</title><link rel="icon" href="logo.svg">
<style>
:root{--bg:#0E1013;--sf:#171A1F;--ln:#262B33;--ink:#F2F4F7;--mut:#8B93A1;--ac:#F5B83D;--ok:#3DDC97}
@media(prefers-color-scheme:light){:root{--bg:#F6F5F2;--sf:#fff;--ln:#E3E0D8;--ink:#14161A;--mut:#6B7280;--ac:#C98A12}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
#app{height:100%;display:grid;grid-template-columns:230px 1fr;padding-top:env(safe-area-inset-top)}
nav{border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 16px}.logo img{width:32px;height:32px}
nav button{text-align:left;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--mut);font:600 15px inherit;font-family:inherit;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:var(--sf);color:var(--ink)}nav button.on{background:var(--sf);color:var(--ink);box-shadow:inset 3px 0 var(--ac)}
main{overflow-y:auto;padding:22px 26px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{margin:0 0 14px;font-size:22px}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{padding:9px 15px;border-radius:10px;border:0;background:var(--ac);color:#14161A;font:700 14px inherit;font-family:inherit;cursor:pointer}.btn.g{background:none;border:1px solid var(--ln);color:var(--ink)}.btn.d{background:#d9483b;color:#fff}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:600 13px inherit;font-family:inherit;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg)}
input,textarea,select{width:100%;padding:10px 12px;margin:4px 0;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.mut{color:var(--mut)}.av{width:44px;height:44px;border-radius:50%;background:var(--ln);object-fit:cover;display:grid;place-items:center;font-weight:800;flex:none}
.keys{display:flex;gap:4px;height:200px;margin:12px 0}.key{flex:1;border-radius:5px 5px 12px 12px;background:#fff;color:#14161A;border:1px solid #999;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:700;cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .06s}
.key.dn{transform:translateY(3px);background:#eee}.key.nx{background:var(--ac)}.key small{display:block;font-weight:400;color:#666}
.drum .key{border-radius:50%;height:90px;align-self:center;background:var(--ac);border:0;flex:none;width:90px}
.auth{max-width:360px;margin:8vh auto;text-align:center}.auth .logo{justify-content:center;font-size:24px}
.feed{height:calc(100vh - 110px);overflow-y:auto;scroll-snap-type:y mandatory;max-width:420px;margin:0 auto}
.reel{height:100%;scroll-snap-align:start;position:relative;background:#000;border-radius:16px;margin-bottom:10px;overflow:hidden;color:#fff}
.reel video,.reel iframe{width:100%;height:100%;border:0;object-fit:cover}
.reel .cap{position:absolute;left:0;right:70px;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.reel .act{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:12px}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;transition:transform .15s}.rb:active{transform:scale(1.25)}.rb.on{background:var(--ac);color:#14161A}
.msgs{height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px}.m{max-width:75%;padding:8px 12px;border-radius:14px;background:var(--sf);border:1px solid var(--ln)}.m.me{align-self:flex-end;background:var(--ac);color:#14161A;border:0}
.ver{color:var(--ac)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:9}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:1fr auto}nav{order:2;flex-direction:row;border:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;background:var(--sf)}
nav .logo,nav .out{display:none}nav button{text-align:center;padding:9px 6px;font-size:12px}nav button.on{box-shadow:inset 0 3px var(--ac)}main{padding:16px 14px}.feed{height:calc(100vh - 150px)}.keys{height:170px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><nav id="nav"></nav><main id="m"></main></div>
<script>
let T=localStorage.t||'',ME=null,ADM=0,tab='learn',S={inst:'Piano',lvl:0,song:0,pos:0,miss:0,q:'',w:'',chat:null};
const $=s=>document.querySelector(s),E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
const api=async(a,o={})=>{let r,x;try{const init={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,t:T,...o})};x=await fetch('/api',init);if(x.status===404)x=await fetch('/api/index',init);r=await x.json()}catch(e){const m='Server not reachable ('+(x?x.status:'offline')+'). Check the API deployed and the Upstash variables are set.';toast(m);throw Error(m)}if(r.err){toast(r.err);throw Error(r.err)}return r};
const emb=u=>{const y=/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/.exec(u||'');return y?`<iframe class="vid" style="height:100%" src="https://www.youtube-nocookie.com/embed/${y[1]}" allow="encrypted-media;fullscreen" allowfullscreen loading="lazy"></iframe>`:`<video src="${E(u)}" controls playsinline loop style="width:100%;height:100%"></video>`};
const avt=u=>u&&u.pic?`<img class="av" src="${u.pic}" alt="">`:`<div class="av">${E((u&&u.u||'?')[0]).toUpperCase()}</div>`;
const nm=u=>`@${E(u.u)}${u.ver?' <span class="ver" title="Verified">✔</span>':''}`;
// ---- audio
const KB='asdfghjk',N=['C4','D4','E4','F4','G4','A4','B4','C5'],SM={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const P={piano:{t:'triangle',a:.005,d:1.4},mallet:{t:'sine',a:.002,d:.5},flute:{t:'sine',a:.07,s:1,v:1},reed:{t:'sawtooth',a:.05,s:1,v:1,lp:1400},brass:{t:'sawtooth',a:.05,s:1,lp:1800},low:{t:'sawtooth',a:.04,s:1,lp:500},string:{t:'sawtooth',a:.1,s:1,v:1,lp:2500},pluck:{t:'triangle',a:.003,d:1},drum:{t:'drum'}};
const IN={Piano:['piano',0],Saxophone:['reed',0],Flute:['flute',1],Clarinet:['reed',0],Trumpet:['brass',0],Euphonium:['low',-1],Xylophone:['mallet',1],Trombone:['brass',-1],'Bass guitar':['pluck',-2],Violin:['string',1],Tuba:['low',-2],'African drums':['drum',0],'French horn':['brass',-1]};
let ctx;const AC=()=>ctx||(ctx=new(window.AudioContext||window.webkitAudioContext)());
const fq=(n,sh)=>440*2**((12*(+n.slice(-1)+1+sh)+SM[n[0]]-69)/12);
function tone(c,d,n,inst,t,dur){const [pk,sh]=IN[inst],p=P[pk],f=fq(n,sh);
if(p.t==='drum'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(fq(n,-2)*1.6,t);o.frequency.exponentialRampToValueAtTime(fq(n,-2)*.6,t+.25);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(d);o.start(t);o.stop(t+.5);return}
const o=c.createOscillator(),g=c.createGain();o.type=p.t;o.frequency.value=f;let x=o;
if(p.lp){const l=c.createBiquadFilter();l.frequency.value=p.lp;o.connect(l);x=l}
if(p.v){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.2;lg.gain.value=f*.011;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+1)}
x.connect(g);g.connect(d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+p.a);const L=p.s?Math.max(dur,.25):p.d;
if(p.s){g.gain.setValueAtTime(.28,t+L);g.gain.linearRampToValueAtTime(0,t+L+.12)}else g.gain.exponentialRampToValueAtTime(.001,t+L);o.start(t);o.stop(t+L+.2)}
const parse=s=>s.trim().split(/\s+/).map(x=>{const[n,b]=x.split(':');return[n,parseFloat(b)||1]});
function seq(s,inst,bpm=110){const c=AC();let t=c.currentTime+.05;parse(s).forEach(([n,b])=>{tone(c,c.destination,n,inst,t,b*60/bpm*.95);t+=b*60/bpm})}
function wav(b){const d=b.getChannelData(0),a=new ArrayBuffer(44+d.length*2),v=new DataView(a),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);d.forEach((x,i)=>v.setInt16(44+i*2,Math.max(-1,Math.min(1,x))*32767,true));return new Blob([a],{type:'audio/wav'})}
async function dlSong(t,n){const q=parse(n),len=q.reduce((a,x)=>a+x[1],0)*60/110+1.5,o=new OfflineAudioContext(1,44100*len,44100);let x=0;q.forEach(([k,b])=>{tone(o,o.destination,k,'Piano',x,b*60/110);x+=b*60/110});
const a=document.createElement('a');a.href=URL.createObjectURL(wav(await o.startRendering()));a.download=t.replace(/\W+/g,'_')+'.wav';document.body.appendChild(a);a.click();a.remove();toast('Downloading '+t)}
// ---- lessons
const LV=['Beginner','Intermediate','Pro'],LS=[[['Twinkle','C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2'],['Scale up','C4:1 D4:1 E4:1 F4:1 G4:1 A4:1 B4:1 C5:2']],[['Ode to Joy','E4:1 E4:1 F4:1 G4:1 G4:1 F4:1 E4:1 D4:1 C4:1 C4:1 D4:1 E4:1.5 D4:.5 D4:2'],['Mary','E4:1 D4:1 C4:1 D4:1 E4:1 E4:1 E4:2 D4:1 D4:1 D4:2 E4:1 G4:1 G4:2']],[['Run','C4:.5 E4:.5 G4:.5 C5:.5 B4:.5 G4:.5 E4:.5 C4:.5 D4:.5 F4:.5 A4:.5 C5:.5 A4:.5 F4:.5 D4:.5 C4:.5'],['Leaps','C4:.5 C5:.5 D4:.5 B4:.5 E4:.5 A4:.5 F4:.5 G4:.5 C4:.5 G4:.5 E4:.5 C5:1']]];
const BI=[['Midnight Drive','Built-in','E4:.5 G4:.5 A4:1 G4:.5 E4:.5 D4:1 C4:2'],['Golden Hour','Built-in','C4:.5 E4:.5 G4:.5 C5:1 B4:.5 G4:.5 E4:1 C4:1']];
const daily=()=>{const d=Math.floor(Date.now()/864e5),l=d%3;return{l,s:d%2,txt:`Today: play “${LS[l][d%2][0]}” (${LV[l]}) without a miss.`}};
// ---- views
const V={};
V.learn=async()=>{const q=LS[S.lvl][S.song],nx=S.pos<parse(q[1]).length?parse(q[1])[S.pos][0]:null,dd=daily(),dr=S.inst==='African drums';
let tut=[];try{tut=(await api('tuts',{i:S.inst})).list}catch(e){}
let notes=[];if(T&&!ADM)try{notes=(await api('notes')).list}catch(e){}
return`<h2>Learn and practice</h2><div class="row wrap">${Object.keys(IN).map(i=>`<button class="chip ${S.inst===i?'on':''}" data-a="inst" data-v="${i}">${i}</button>`).join('')}</div>
<div class="card"><div class="row sp wrap"><b>${dd.txt}</b><span class="mut">Streak: ${localStorage.streak||0} days</span></div></div>
<div class="row wrap">${LV.map((l,i)=>`<button class="chip ${S.lvl===i?'on':''}" data-a="lvl" data-v="${i}">${l}</button>`).join('')}${LS[S.lvl].map((s,i)=>`<button class="chip ${S.song===i?'on':''}" data-a="song" data-v="${i}">${s[0]}</button>`).join('')}</div>
<div class="keys ${dr?'drum':''}">${N.map((n,i)=>`<div class="key ${n===nx?'nx':''}" role="button" tabindex="0" data-n="${n}">${n.replace(/\d/,'')}<small>${KB[i]}</small></div>`).join('')}</div>
<div class="row"><button class="btn" data-a="listen">Listen</button><button class="btn g" data-a="restart">Restart</button><span class="mut">${nx?`Play the highlighted key (${S.pos+1}/${parse(q[1]).length})`:'Lesson complete'}</span></div>
<h3>Video tutorials</h3>${tut.length?tut.map(t=>`<div class="card"><b>${E(t.title)}</b><div style="margin-top:8px">${emb(t.yt).replace('style="height:100%"','')}</div></div>`).join(''):`<p class="mut">No tutorials for ${S.inst} yet. Admins add them from the dashboard.</p>`}
<h3>My notes</h3>${T&&!ADM?`<div class="card"><input id="nt" placeholder="Title"><input id="nl" placeholder="YouTube link or anything you want to learn"><button class="btn" data-a="noteAdd">Save to notes</button></div>${notes.map((n,i)=>`<div class="card"><div class="row sp"><b>${E(n.title)}</b><button class="chip" data-a="noteDel" data-v="${i}">Remove</button></div>${/youtu/.test(n.l)?emb(n.l).replace('style="height:100%"',''):`<p>${E(n.l)}</p>`}</div>`).join('')}`:'<p class="mut">Create an account to keep notes.</p>'}`};
V.dl=async()=>{let L=[];try{L=(await api('songs',{q:S.q})).list}catch(e){}const q=S.q.toLowerCase();
const all=[...L.map(x=>({t:x.t,a:x.u,n:x.n,p:1})),...BI.map(x=>({t:x[0],a:x[1],n:x[2]})).filter(x=>x.t.toLowerCase().includes(q))];
return`<h2>Download music</h2><input id="sq" placeholder="Search by title, artist or lyrics" value="${E(S.q)}">${all.length?all.map((x,i)=>`<div class="card row sp"><div><b>${E(x.t)}</b> ${x.p?'<span class="mut">· promoted</span>':''}<br><span class="mut">${E(x.a)}</span></div><div class="row"><button class="chip" data-a="prev" data-v="${E(x.n)}">Play</button><button class="btn" aria-label="Download" data-a="get" data-t="${E(x.t)}" data-v="${E(x.n)}">⬇</button></div></div>`).join(''):'<p class="mut">No matches. Try different words.</p>'}`};
V.reels=async()=>{const L=(await api('feed')).list;return`<div class="row sp" style="max-width:420px;margin:0 auto 10px"><h2 style="margin:0">Reels</h2><button class="btn" data-a="postForm">Post reel</button></div><div id="pf"></div><div class="feed">${L.length?L.map(r=>`<div class="reel">${emb(r.url)}<div class="cap"><b>${nm(r.au)}</b><br>${E(r.cap)}</div><div class="act"><button class="rb ${r.liked?'on':''}" aria-label="Like" data-a="like" data-v="${r.id}">♥<small style="display:block;font-size:10px">${r.likes}</small></button><button class="rb" aria-label="Save" data-a="saveR" data-v="${r.id}">★</button><button class="rb" aria-label="Follow" data-a="follow" data-v="${r.u}">+</button></div></div>`).join(''):'<p class="mut">No reels yet. Be the first to post.</p>'}</div>`};
V.chat=async()=>{const w=S.chat;if(!w){const ib=(await api('inbox')).list;return`<h2>Chat</h2><p class="mut">You can message friends: people who follow each other.</p><div class="row"><input id="cw" placeholder="Username to chat with"><button class="btn" data-a="openChat">Open</button></div>${ib.map(u=>`<div class="card row sp"><b>@${E(u)}</b><button class="chip" data-a="openChat" data-v="${E(u)}">Open</button></div>`).join('')}`}
const L=(await api('thread',{w})).list;return`<div class="row sp"><h2>@${E(w)}</h2><span><button class="chip" data-a="report" data-v="${E(w)}">Report</button> <button class="chip" data-a="closeChat">Back</button></span></div><div class="msgs" id="ms">${L.map(x=>`<div class="m ${x.f===ME.u?'me':''}">${E(x.m)}</div>`).join('')}</div><div class="row"><input id="mi" placeholder="Message" maxlength="500"><button class="btn" data-a="send">Send</button></div>`};
V.acc=async()=>{const sv=(await api('saved')).list,f=await api('friends'),me=(await api('user',{u:ME.u}));
return`<div class="row"><div style="width:72px">${avt(ME).replace('class="av"','class="av" style="width:72px;height:72px"').replace('<div class="av"','<div class="av" style="width:72px;height:72px;font-size:28px"')}</div><div><h2 style="margin:0">${nm(ME)}</h2><span class="mut">${me.followers} followers · ${me.following} following</span></div></div>
<div class="card"><b>Edit profile</b><p class="mut" style="margin:2px 0">Your username is public and unique. We never ask for your phone number.</p><input type="file" id="pp" accept="image/*"><textarea id="bio" rows="2" maxlength="160" placeholder="Bio">${E(ME.bio)}</textarea><button class="btn" data-a="prof">Save profile</button></div>
<div class="card"><b>Find people</b><div class="row"><input id="fp" placeholder="Search usernames"><button class="btn" data-a="people">Search</button></div><div id="pr"></div><p class="mut">Friends (mutual): ${f.mutual.map(x=>'@'+E(x)).join(', ')||'none yet'}</p></div>
<div class="card"><b>Promote your song</b><input id="pt" placeholder="Title"><input id="pn" placeholder="Notes e.g. C4:1 E4:1 G4:2"><input id="pl" placeholder="Lyrics (helps people find it)"><button class="btn" data-a="promote">Promote</button></div>
<h3>Saved reels</h3>${sv.length?`<div class="row wrap">${sv.map(r=>`<div style="width:200px;height:300px" class="reel">${emb(r.url)}</div>`).join('')}</div>`:'<p class="mut">Tap ★ on a reel to save it here.</p>'}<p><button class="btn g" data-a="out">Log out</button></p>`};
V.admin=async()=>{const s=await api('aStats'),u=(await api('aUsers')).list,r=(await api('feed').catch(()=>({list:[]}))).list;
let L=[];try{L=(await api('feed')).list}catch(e){}
return`<h2>Admin dashboard</h2><div class="row wrap"><div class="card">Users<br><b>${s.users}</b></div><div class="card">Reels<br><b>${s.reels}</b></div><div class="card">Reports<br><b>${s.reports.length}</b></div></div>
<h3>Reel algorithm</h3><div class="card row wrap"><label>Follow boost<input id="cf" type="number" value="${s.cfg.follow}"></label><label>Freshness decay (hours per point)<input id="cd" type="number" value="${s.cfg.fresh}"></label><button class="btn" data-a="cfg">Save</button></div>
<h3>Create account</h3><div class="card row wrap"><input id="nu" placeholder="username" style="width:160px"><input id="np" placeholder="password" style="width:160px"><button class="btn" data-a="aCreate">Create</button></div>
<h3>Accounts</h3>${u.map(x=>`<div class="card row sp wrap"><b>@${E(x.u)} ${x.ver?'✔':''} ${x.ban?'(banned)':''}</b><span><button class="chip" data-a="aSet" data-u="${x.u}" data-k="ver" data-v="${x.ver?0:1}">${x.ver?'Unverify':'Verify'}</button> <button class="chip" data-a="aSet" data-u="${x.u}" data-k="ban" data-v="${x.ban?0:1}">${x.ban?'Unban':'Ban'}</button> <button class="btn d" data-a="aSet" data-u="${x.u}" data-k="del">Delete</button></span></div>`).join('')}
<h3>Reels</h3>${L.map(x=>`<div class="card row sp wrap"><span>@${E(x.u)}: ${E(x.cap)||E(x.url)}</span><span><input type="number" value="${x.boost}" style="width:70px" id="b${x.id}"> <button class="chip" data-a="aBoost" data-v="${x.id}">Boost</button> <button class="btn d" data-a="aReelDel" data-v="${x.id}">Delete</button></span></div>`).join('')}
<h3>Reported chats</h3>${s.reports.map(k=>`<div class="card"><button class="chip" data-a="aRep" data-v="${E(k)}">Open ${E(k)}</button><div id="rp${E(k).replace(/\W/g,'')}"></div></div>`).join('')||'<p class="mut">No reports.</p>'}
<h3>Add tutorial</h3><div class="card"><select id="ti">${Object.keys(IN).map(i=>`<option>${i}</option>`).join('')}</select><input id="tt" placeholder="Title"><input id="ty" placeholder="YouTube link"><button class="btn" data-a="aTut">Add</button></div>`};
// ---- shell
function nav(){const t=[['learn','Learn'],['dl','Download'],['reels','Reels'],['chat','Chat'],['acc','Account']];if(ADM)t.push(['admin','Admin']);
$('#nav').innerHTML=`<div class="logo"><img src="logo.svg" alt="">Mr.Music.Man</div>`+t.filter(x=>!(ADM&&['reels','chat','acc'].includes(x[0]))).map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')+(T?`<button class="out" data-a="out" style="margin-top:auto">Log out</button>`:`<button class="out" data-a="tab" data-v="auth" style="margin-top:auto">Log in</button>`)}
let mode='login';
const authV=()=>`<div class="auth"><div class="logo"><img src="logo.svg" alt="" style="width:44px;height:44px">Mr.Music.Man</div><p class="mut">${mode==='login'?'Log in to continue':'Create your account'}</p><input id="au" placeholder="Username" autocomplete="username"><input id="ap" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:8px" data-a="auth">${mode==='login'?'Log in':'Create account'}</button><p class="mut">${mode==='login'?'New here? <a href="#" data-a="mode" style="color:var(--ac)">Create account</a>':'Already have an account? <a href="#" data-a="mode" style="color:var(--ac)">Log in</a>'}</p></div>`;
async function show(){nav();const gate=!T&&tab!=='learn';try{$('#m').innerHTML=gate||tab==='auth'?authV():await V[tab]();const ms=$('#ms');if(ms)ms.scrollTop=1e9}catch(e){if(!T)$('#m').innerHTML=authV()}}
async function boot(){if(T)try{const r=await api('me');ME=r.me;ADM=r.admin?1:0;if(ADM)tab='admin'}catch(e){T='';localStorage.t=''}show()}
// ---- events
function press(n){const c=AC();c.resume();tone(c,c.destination,n,S.inst,c.currentTime,.6);const e=document.querySelector(`[data-n="${n}"]`);if(e){e.classList.add('dn');setTimeout(()=>e.classList.remove('dn'),120)}
const q=parse(LS[S.lvl][S.song][1]);if(S.pos<q.length){if(q[S.pos][0]===n){S.pos++;if(S.pos===q.length){toast(S.miss?'Lesson complete':'Perfect run!');if(!S.miss&&daily().l===S.lvl&&localStorage.sd!==String(Math.floor(Date.now()/864e5))){localStorage.sd=Math.floor(Date.now()/864e5);localStorage.streak=+(localStorage.streak||0)+1}}show()}else S.miss=1}}
document.addEventListener('pointerdown',e=>{const k=e.target.closest('.key');if(k)press(k.dataset.n)});
document.addEventListener('keydown',e=>{if(tab!=='learn'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.repeat)return;const i=KB.indexOf(e.key);if(i>=0)press(N[i])});
document.addEventListener('input',e=>{if(e.target.id==='sq'){S.q=e.target.value;clearTimeout(S.tm);S.tm=setTimeout(async()=>{await show();const q=$('#sq');q.focus();q.setSelectionRange(1e3,1e3)},300)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mi')document.querySelector('[data-a=send]').click()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,d=b.dataset;const val=i=>($('#'+i)||{}).value||'';e.preventDefault();
try{
if(a==='tab'){tab=v;S.chat=null;show()}else if(a==='inst'){S.inst=v;show()}else if(a==='lvl'){S.lvl=+v;S.song=0;S.pos=0;S.miss=0;show()}else if(a==='song'){S.song=+v;S.pos=0;S.miss=0;show()}
else if(a==='restart'){S.pos=0;S.miss=0;show()}else if(a==='listen')seq(LS[S.lvl][S.song][1],S.inst)
else if(a==='prev')seq(v,'Piano');else if(a==='get')dlSong(d.t,v)
else if(a==='mode'){mode=mode==='login'?'signup':'login';show()}
else if(a==='auth'){const r=await api(mode,{u:val('au'),p:val('ap')});T=r.t;localStorage.t=T;ME=r.me;ADM=r.admin?1:0;tab=ADM?'admin':'learn';boot()}
else if(a==='out'){T='';localStorage.t='';ME=null;ADM=0;tab='learn';show()}
else if(a==='noteAdd'){await api('noteAdd',{title:val('nt'),l:val('nl')});show()}else if(a==='noteDel'){await api('noteDel',{i:+v});show()}
else if(a==='postForm'){$('#pf').innerHTML=`<div class="card" style="max-width:420px;margin:0 auto 10px"><input id="ru" placeholder="Video link (.mp4 or YouTube)"><input id="rc" placeholder="Caption"><button class="btn" data-a="rpost">Post</button></div>`}
else if(a==='rpost'){await api('reelPost',{url:val('ru'),cap:val('rc')});toast('Reel posted');show()}
else if(a==='like'){await api('like',{id:v});show()}else if(a==='saveR'){const r=await api('saveReel',{id:v});toast(r.on?'Saved to your account':'Removed from saved')}
else if(a==='follow'){const r=await api('follow',{u:v});toast(r.on?'Following @'+v:'Unfollowed @'+v)}
else if(a==='openChat'){S.chat=(v||val('cw')).toLowerCase();show();clearInterval(S.poll);S.poll=setInterval(()=>{if(S.chat&&tab==='chat'&&!document.activeElement.value)show();else if(!S.chat)clearInterval(S.poll)},5000)}
else if(a==='closeChat'){S.chat=null;show()}else if(a==='send'){const m=val('mi');if(m){await api('send',{to:S.chat,m});show()}}else if(a==='report'){await api('report',{w:v});toast('Reported. Thank you.')}
else if(a==='prof'){const f=$('#pp').files[0];let pic;if(f)pic=await new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
const r=await api('profile',{bio:val('bio'),pic});ME=r.me;toast('Profile saved');show()}
else if(a==='people'){const r=await api('people',{q:val('fp')});$('#pr').innerHTML=r.list.map(u=>`<div class="row sp" style="margin:6px 0"><b>@${E(u)}</b><button class="chip" data-a="follow" data-v="${E(u)}">Follow / unfollow</button></div>`).join('')||'<p class="mut">No one found.</p>'}
else if(a==='promote'){await api('promote',{ti:val('pt'),n:val('pn'),l:val('pl')});toast('Your song is live in Download')}
else if(a==='cfg'){await api('aCfg',{follow:val('cf'),fresh:val('cd')});toast('Algorithm updated')}
else if(a==='aCreate'){await api('aCreate',{u:val('nu'),p:val('np')});toast('Account created');show()}
else if(a==='aSet'){if(d.k==='del'&&!confirm('Delete @'+d.u+'?'))return;await api('aSet',{u:d.u,k:d.k,v:+d.v});show()}
else if(a==='aReelDel'){await api('aReelDel',{id:v});show()}else if(a==='aBoost'){await api('aBoost',{id:v,v:val('b'+v)});toast('Boost set')}
else if(a==='aRep'){const r=await api('aReported',{k:v});$('#rp'+v.replace(/\W/g,'')).innerHTML=r.list.map(x=>`<p><b>@${E(x.f)}</b>: ${E(x.m)}</p>`).join('')}
else if(a==='aTut'){await api('aTut',{i:val('ti'),title:val('tt'),yt:val('ty')});toast('Tutorial added');show()}
}catch(err){}});
boot();
</script></body></html>
