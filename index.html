async function sysCheck(){const o=$('#sysout');o.innerHTML='Checking...';try{const r=await fetch('/api/health');if(!r.ok)throw 0;const j=await r.json();o.innerHTML=[['Shared database (Redis)',j.database],['Paystack secret key (Vercel)',j.paystackSecret],['Admin password or key (Vercel)',j.adminLogin],['Paystack key is a live key',j.paystackLive],['SMS key and URL (Vercel)',j.sms],['Admin server key (Vercel)',j.adminKey],['Paystack public key in the site',!!PSK]].map(([n,v])=>`<p>${n}: <b style="color:${v?'var(--ok)':'var(--bad)'}">${v?'OK':'Missing'}</b></p>`).join('')}catch(e){o.innerHTML='The /api functions are not reachable. Upload the api folder and package.json, then redeploy.'}}
let bimg='';
const slideV=()=>{const b=(S.banners||[]).filter(x=>x.on!==false&&x.img);if(!b.length)return'';return `<div class="bnw"><div class="bn" onscroll="dots(this)">${b.map(x=>`<div class="bs" style="background-image:url(${x.img})" ${x.store?`onclick="go('#/s/${x.store}')"`:''}><div class="bsh"></div>${x.title?`<b>${esc(x.title)}</b>`:''}${x.sub?`<span>${esc(x.sub)}</span>`:''}</div>`).join('')}</div>${b.length>1?`<button class="ar l" onclick="slideBy(this,-1)">‹</button><button class="ar r" onclick="slideBy(this,1)">›</button><div class="dt">${b.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}</div>`};
const dots=e=>{const i=Math.round(e.scrollLeft/(e.clientWidth||1));e.parentElement.querySelectorAll('.dt i').forEach((d,k)=>d.className=k==i?'on':'')},slideBy=(btn,d)=>{const e=btn.parentElement.querySelector('.bn');e.scrollBy({left:d*e.clientWidth,behavior:'smooth'})};
const bannerV=()=>`<div class="card"><b style="font-size:17px">Publish a home-page slide</b><p class="mu" style="margin:4px 0 10px">Slides appear at the top of the market on every device within seconds.</p><input id="bt" placeholder="Title (for example: New stores this week)"><input id="bs2" placeholder="Short line (optional)"><label>Opens this store when tapped (optional)</label><select id="bst"><option value="">No link</option>${S.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn o s" onclick="img(d=>{bimg=d;toast('Photo ready')},900,.6)">${ic('camera',14)} Choose photo</button> <button class="btn s" onclick="addBanner()">Publish slide</button></div>`+((S.banners||[]).map((x,i)=>`<div class="card" style="display:flex;gap:12px;align-items:center"><div style="width:96px;height:54px;border-radius:10px;background:#0b0f2e url(${x.img}) center/cover;flex:none"></div><div style="flex:1;min-width:0"><b>${esc(x.title)||'(no title)'}</b><div class="mu">${esc(x.sub||'')} ${x.store?'· opens '+esc(sname(x.store)||'store'):''} ${x.on===false?'· hidden':''}</div></div><button class="btn o s" onclick="bnTog(${i})">${x.on===false?'Show':'Hide'}</button> <button class="btn r s" onclick="bnDel(${i})">${ic('trash',14)}</button></div>`).join('')||'<div class="em">No slides yet.</div>');
function addBanner(){if(!bimg)return toast('Choose a photo first');if((S.banners||[]).length>=8)return toast('Up to 8 slides. Delete one first');S.banners=[...(S.banners||[]),{id:uid(),title:$('#bt').value.trim(),sub:$('#bs2').value.trim(),store:$('#bst').value,img:bimg,on:true}];bimg='';save();toast('Slide published');view()}
const bnTog=i=>{S.banners[i].on=S.banners[i].on===false;save();view()},bnDel=i=>{S.banners.splice(i,1);save();view()};
function mkStore(){const v=id=>$(id).value.trim(),name=v('#ns'),cat=$('#nc').value=='Other'?v('#noc'):$('#nc').value;if(!name||!cat)return toast('Enter store name and category');let owner=$('#no').value;
if(owner=='new'){if(!v('#nn')||!/^\S+@\S+\.\S+$/.test(v('#ne'))||v('#npw').length<4)return toast('Owner needs a name, valid email and password (min 4)');if(S.users.some(x=>x.email==v('#ne')))return toast('That email already has an account');const u={id:uid(),name:v('#nn'),email:v('#ne'),phone:v('#np'),pass:$('#npw').value,active:true};S.users.push(u);owner=u.id}
S.stores.push({id:uid(),name,cat,owner,verified:$('#nv').checked,plan:$('#npl').value,logo:'',active:true});save();toast('Store created');atab='Stores';view()}
function exportCSV(){const rows=[['Date','Buyer','Store','Items','Address','Total','Status'],...S.orders.filter(o=>!o.rent).map(o=>[o.date,usr(o.user).name,ostores(o),o.items.map(i=>prodOf(i.id).name+' x'+i.q).join('; '),o.addr,o.total,o.status])],c=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='delipo-orders.csv';a.click()}
async function sms(){const to=S.users.filter(u=>$('#aud').value=='all'||S.stores.some(s=>s.owner==u.id)).map(u=>u.phone).filter(Boolean);let t='sent';try{const r=await fetch('/api/sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:$('#sk').value,to,message:$('#sm').value})});if(r.status==404)t='demo (no server)';else if(!r.ok){let j={};try{j=await r.json()}catch(e){}t='failed: '+(j.error||j.response||r.status)}}catch(e){t='demo (no server)'}S.sms.unshift({d:new Date().toLocaleString(),n:to.length,t});save();toast('SMS: '+t);view()}
setInterval(()=>document.querySelectorAll('.ss2,.ss.big,.bn').forEach(e=>{const w=e.firstElementChild?.offsetWidth||0;e.scrollLeft+e.clientWidth>=e.scrollWidth-4?e.scrollTo({left:0,behavior:'smooth'}):e.scrollBy({left:w,behavior:'smooth'})}),2600);
addEventListener('hashchange',view);(async()=>{await initApi();boot();view()})();
